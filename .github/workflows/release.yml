name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches VERSION
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
      - name: Test
        run: swift test
      - name: Check translations
        run: python3 scripts/check-l10n.py
      - name: Build app and DMG
        run: ./scripts/make-dmg.sh
      - name: Check the app icon has its dark variant
        run: xcrun assetutil --info build/PureValet.app/Contents/Resources/Assets.car | grep -q NSAppearanceNameDarkAqua
      - name: Release notes from CHANGELOG.md
        run: |
          ./scripts/changelog-section.sh "$(cat VERSION)" > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $(cat VERSION)"; exit 1; }
          printf '\n---\nInstall: `brew install --cask aubinvan/tap/purevalet` or download the DMG below (not notarized, see the README). Verify with `shasum -a 256 -c PureValet-%s.dmg.sha256`.\n' "$(cat VERSION)" >> notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "build/PureValet-$V.dmg" "build/PureValet-$V.dmg.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "build/PureValet-$V.dmg" "build/PureValet-$V.dmg.sha256" \
              --title "PureValet $V" --notes-file notes.md --verify-tag --latest
          fi
