name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app and DMG
        run: ./scripts/make-dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: PureValet-dmg
          path: |
            build/*.dmg
            build/*.dmg.sha256
