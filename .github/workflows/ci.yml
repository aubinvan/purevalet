name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Check translations
        run: python3 scripts/check-l10n.py
      - name: Check shell scripts
        run: for f in build.sh scripts/*.sh; do sh -n "$f"; done
      - name: Build app and DMG
        run: ./scripts/make-dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: PureValet-dmg
          path: |
            build/*.dmg
            build/*.dmg.sha256
