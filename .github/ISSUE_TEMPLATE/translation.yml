name: Translation
description: Fix a translation or add a new language.
labels: ["translation"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "French, Spanish, …"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: Quote the current text and your suggestion, or say which language you want to add.
    validations:
      required: true
